plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ritulayaauth'
version = '0.1.0'

android {
  namespace "expo.modules.ritulayaauth"
  compileSdk 36
  defaultConfig {
    minSdk 24
    targetSdk 36
    versionCode 1
    versionName "0.1.0"
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = "17" }
}

dependencies {
  // Match the version already supplied by the pinned Expo LocalAuthentication.
  implementation "androidx.biometric:biometric:1.2.0-alpha04"
  testImplementation "junit:junit:4.13.2"
}
