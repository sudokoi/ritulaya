plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ritulayapredictions'
version = '0.1.0'

android {
  namespace "expo.modules.ritulayapredictions"
  compileSdk 35
  defaultConfig {
    minSdk 24
    targetSdk 35
    versionCode 1
    versionName "0.1.0"
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
  testOptions {
    unitTests {
      returnDefaultValues = true
    }
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.15.0"
  implementation project(":ritulaya-db")

  testImplementation "junit:junit:4.13.2"
  testImplementation "com.google.truth:truth:1.1.3"
}
