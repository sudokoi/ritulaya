plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ritulayacrypto'
version = '0.1.0'

android {
  namespace "expo.modules.ritulayacrypto"
  compileSdk 35
  defaultConfig {
    minSdk 24
    targetSdk 35
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
}
