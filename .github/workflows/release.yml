name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        profile: [internal, production]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Enable corepack
        run: corepack enable

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Determine version name
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build with EAS
        id: build
        run: |
          eas build --platform android --profile ${{ matrix.profile }} --non-interactive --json > build-output.json
          BUILD_URL=$(jq -r '.[0].artifacts.buildUrl' build-output.json)
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Download artifact
        run: |
          EXT=${{ matrix.profile == 'production' && 'aab' || 'apk' }}
          curl -L -o "ritulaya-${{ steps.version.outputs.version_name }}-${{ matrix.profile }}.$EXT" "${{ steps.build.outputs.build_url }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ritulaya-${{ steps.version.outputs.version_name }}-${{ matrix.profile }}
          path: ritulaya-${{ steps.version.outputs.version_name }}-${{ matrix.profile }}.${{ matrix.profile == 'production' && 'aab' || 'apk' }}

      - name: Submit to Play Store
        if: startsWith(github.ref, 'refs/tags/') && matrix.profile == 'production'
        run: |
          eas submit --platform android --profile production --path ritulaya-${{ steps.version.outputs.version_name }}-production.aab --non-interactive

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Determine version name
        id: version
        run: |
          echo "version_name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ritulaya-${{ steps.version.outputs.version_name }}-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ritulaya-${{ steps.version.outputs.version_name }}-internal.apk
            ritulaya-${{ steps.version.outputs.version_name }}-production.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
