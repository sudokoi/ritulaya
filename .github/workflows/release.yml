name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        profile: [internal, production]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Enable corepack
        run: corepack enable

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Determine version name
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build locally
        run: |
          if [ "${{ matrix.profile }}" == "production" ]; then
            EXT="aab"
          else
            EXT="apk"
          fi
          eas build --platform android --profile ${{ matrix.profile }} --local --non-interactive --output="./ritulaya-${{ steps.version.outputs.version_name }}-${{ matrix.profile }}.$EXT"

      - name: Download bundletool
        if: matrix.profile == 'production'
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check

      - name: Check 16 KB page-size alignment
        env:
          ARTIFACT: ritulaya-${{ steps.version.outputs.version_name }}-${{ matrix.profile }}.${{ matrix.profile == 'production' && 'aab' || 'apk' }}
        run: python3 scripts/check-android-page-size.py "$ARTIFACT" --bundletool "$RUNNER_TEMP/bundletool.jar"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ritulaya-${{ steps.version.outputs.version_name }}-${{ matrix.profile }}
          path: ritulaya-${{ steps.version.outputs.version_name }}-${{ matrix.profile }}.${{ matrix.profile == 'production' && 'aab' || 'apk' }}

      - name: Submit to Play Store (production)
        if: startsWith(github.ref, 'refs/tags/') && matrix.profile == 'production'
        run: |
          eas submit --platform android --profile production --path ritulaya-${{ steps.version.outputs.version_name }}-production.aab --non-interactive

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Determine version name
        id: version
        run: |
          echo "version_name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ritulaya-${{ steps.version.outputs.version_name }}-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ritulaya-${{ steps.version.outputs.version_name }}-internal.apk
            ritulaya-${{ steps.version.outputs.version_name }}-production.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
