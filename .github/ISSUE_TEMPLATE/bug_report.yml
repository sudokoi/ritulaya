name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
        Please note: Ritulaya never collects analytics or telemetry.
        Review diagnostic output before sharing it. Do not include health
        entries, repository tokens, or other personal information.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open app
        2. Go to ...
        3. Tap on ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android Version
      placeholder: e.g. 14
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device Model
      placeholder: e.g. Pixel 8
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Debug Logs
      description: |
        Use Settings → Report Bug to prepare local diagnostics.
        Review the output and remove any personal information before sharing.
      placeholder: Paste redacted log output here.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, anything else helpful.
